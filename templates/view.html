<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ filename }} — Meta Tech</title>
    <meta property="og:title" content="{{ filename }} — Meta Tech">
    <meta property="og:description" content="Watch video on Meta Tech">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="{{ video_url }}">
    <meta property="og:video:type" content="{{ mime_type }}">
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="{{ filename }} — Meta Tech">
    <meta name="twitter:description" content="Watch video on Meta Tech">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=7) }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-icon.svg') }}?v=2">
    <script src="{{ url_for('static', filename='js/monetag.js', v=2) }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ai-widget.css', v=1) }}">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">
            <div class="logo-icon"><img src="{{ url_for('static', filename='img/logo-icon.svg') }}?v=2" alt="M"></div>
            <span class="logo-text">Meta</span>
            <span class="logo-sub">Tech</span>
        </a>
        <div class="header-actions">
            <a href="{{ url_for('recent') }}" class="btn-ghost">Browse</a>
            <a href="/" class="btn-accent">Upload</a>
        </div>
    </header>

    <main class="view-container">
        <div class="video-meta">
            <span class="video-meta-item">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
                {{ file_type }}
            </span>
            <span class="video-meta-item">
                <span class="meta-dot"></span>
            </span>
            <span class="video-meta-item">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                {{ file_size }}
            </span>
            <span class="video-meta-item">
                <span class="meta-dot"></span>
            </span>
            <span class="video-meta-item">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Hosted on Meta Tech
            </span>
        </div>

        <div class="video-player-wrap">
            <video controls playsinline preload="metadata">
                <source src="{{ video_url }}" type="{{ mime_type }}">
                Your browser doesn't support video playback.
            </video>
        </div>

        <div class="view-actions">
            <a href="{{ video_url }}" download class="btn-download">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download Video
            </a>
            <button class="btn-action" onclick="copyLink()">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                Copy Link
            </button>
            <button class="btn-action" onclick="copyEmbed()">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                Embed
            </button>
            <a href="/" class="btn-action">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Upload New
            </a>
            {% if is_admin %}
            <button class="btn-action btn-danger" onclick="confirmDelete()" style="border-color:#ff4757;color:#ff4757;">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Delete
            </button>
            {% endif %}
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-copy">&copy; 2026 Meta Tech</span>
            <div class="footer-divider"></div>
            <div class="footer-links">
                <a href="{{ url_for('terms') }}" class="footer-link">Terms of Service</a>
                <a href="{{ url_for('privacy') }}" class="footer-link">Privacy Policy</a>
                <a href="{{ url_for('abuse') }}" class="footer-link">Report Abuse</a>
                <a href="{{ url_for('contact') }}" class="footer-link">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        function confirmDelete() {
            if (confirm('Delete this video permanently?')) {
                fetch('/delete/{{ filename }}', { method: 'POST' })
                    .then(r => r.json())
                    .then(d => {
                        if (d.success) {
                            window.location.href = '/recent';
                        } else {
                            alert('Error: ' + d.error);
                        }
                    });
            }
        }

        function copyLink() {
            const url = "{{ page_url }}";
            navigator.clipboard.writeText(url).then(function() {
                const btn = event.currentTarget;
                const orig = btn.innerHTML;
                btn.innerHTML = '<svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
                setTimeout(function() { btn.innerHTML = orig; }, 2000);
            }).catch(function() {
                const temp = document.createElement('input');
                temp.value = url;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
            });
        }

        function copyEmbed() {
            const embed = '<video controls width="100%"><source src="{{ video_url }}" type="{{ mime_type }}"></video>';
            navigator.clipboard.writeText(embed).then(function() {
                const btn = event.currentTarget;
                const orig = btn.innerHTML;
                btn.innerHTML = '<svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
                setTimeout(function() { btn.innerHTML = orig; }, 2000);
            }).catch(function() {
                alert('Embed code copied to clipboard!');
            });
        }
    </script>
    <script src="{{ url_for('static', filename='js/ai-widget.js', v=1) }}"></script>
</body>
</html>
